version: 2

models:
  - name: dim_airport
    description: "Swedavias flygplatser, berikade med data från Wikipedia"
    columns:
      - name: airport_iata
        description: "IATA-kod, primärnyckel"
        tests:
          - unique
          - not_null
      - name: airport_name
        tests:
          - not_null

  - name: dim_airline
    description: "Flygbolag som trafikerar Swedavias flygplatser. Namn från Swedavia, land från Wikipedia"
    columns:
      - name: airline_icao
        description: "ICAO-kod, primärnyckel"
        tests:
          - unique
          - not_null
      - name: airline_name
        tests:
          - not_null

  - name: dim_date
    description: "En rad per dag, från första till sista flygdatumet"
    columns:
      - name: date_day
        description: "Datum, primärnyckel"
        tests:
          - unique
          - not_null

  - name: fct_flights
    description: "En rad per flyg (ankomst eller avgång) vid en Swedavia-flygplats"
    columns:
      - name: flight_key
        description: "Unik nyckel: flygplats + flightnummer + tidtabellstid"
        tests:
          - unique
          - not_null
      - name: airport_iata
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_iata
      - name: airline_icao
        tests:
          - relationships:
              arguments:
                to: ref('dim_airline')
                field: airline_icao
      - name: flight_date
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: flight_type
        tests:
          - accepted_values:
              arguments:
                values: ['arrival', 'departure']
